<article class="post">
    <header class="post-header">
        <span class="post-category">{{category}}</span>
        <h1 class="post-title">{{title}}</h1>
        <div class="post-meta">
            <span>📅 {{date}}</span>
            <span>🏷️ {{tags}}</span>
        </div>
    </header>
    <div class="post-content">
        {{content}}
    </div>
    <footer class="post-footer">
        <a href="/{{category}}/">← 返回 {{category_name}}</a>
    </footer>
</article>
